# Nginx configuration snippet for /ifconfig reverse proxy

# Upstream definition for ip2region Go service
upstream ip2region_backend {
    server 127.0.0.1:28080;
    keepalive 32;
}

server {
    listen 80;
    server_name example.com; # Replace with your domain

    # Option 1: Direct pass-through with /ifconfig prefix (Recommended)
    location /ifconfig {
        proxy_pass http://ip2region_backend;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /ifconfig;

        # HTTP/1.1 keepalive optimization
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Option 2: If you prefer prefix stripping, the Go server also automatically supports it:
    # location /ifconfig/ {
    #     proxy_pass http://ip2region_backend/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Forwarded-Prefix /ifconfig;
    # }
}
